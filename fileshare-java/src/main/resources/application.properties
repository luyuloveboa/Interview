server.port=${PORT:8080}
server.address=127.0.0.1
spring.main.banner-mode=off

fileshare.db-path=${DB_PATH:fileshare.db}
fileshare.upload-dir=${UPLOAD_DIR:uploads}

# Public base URL used to build share_url. Never derived from the client's Host header.
# Set BASE_URL to the real public origin in production, e.g. https://files.example.com
fileshare.base-url=${BASE_URL:http://127.0.0.1:${server.port}}

# Max connections in the SQLite pool. SQLite allows one writer at a time, so a
# small pool is enough; extra requests queue in the pool instead of opening files.
fileshare.db-pool-size=${DB_POOL_SIZE:10}

# How often the cleanup job removes expired / exhausted shares (ISO-8601 duration).
fileshare.cleanup-interval=${CLEANUP_INTERVAL:PT10M}

# Upload size limits. Requests over the limit get 413 with a JSON error.
# max-request-size is a bit larger to leave room for the other form fields.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:101MB}
